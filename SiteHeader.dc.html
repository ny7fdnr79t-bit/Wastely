<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<script src="./services-data.js"></script>
</helmet>
<div onMouseLeave="{{ closeSvc }}" style="position:relative;background:rgba(14,36,56,0.9);backdrop-filter:blur(14px);border-bottom:1px solid rgba(252,252,237,0.1);font-family:Inter,system-ui,sans-serif">
  <div style="display:flex;align-items:center;justify-content:space-between;gap:20px;padding:15px clamp(16px,4vw,56px)">
    <a href="Wastely.dc.html" style="display:flex;align-items:center;flex-shrink:0">
      <img src="assets/wastely-icon-navy.png" alt="" style="width:26px;height:26px;display:block;margin-right:10px;border:1px solid rgba(252,252,237,0.14)" />
      <span style="font-family:Inter,sans-serif;font-weight:800;font-size:22px;letter-spacing:-0.02em;text-transform:uppercase;color:#FCFCED">Wastely</span>
    </a>
    <nav style="display:none;gap:32px;align-items:center" data-ws-desk="1">
      <button type="button" onClick="{{ toggleSvc }}" onMouseEnter="{{ openSvc }}" aria-expanded="{{ svcOpen }}" style="display:flex;align-items:center;gap:7px;padding:0;background:transparent;border:none;cursor:pointer;font-family:Inter,sans-serif;font-size:14px;letter-spacing:0.005em;font-weight:500;color:{{ svcColor }}" style-hover="color:#FCFCED">Services <span style="width:0;height:0;border-left:4px solid transparent;border-right:4px solid transparent;border-top:5px solid #B1CDC6"></span></button>
      <sc-for list="{{ links }}" as="l" hint-placeholder-count="5">
        <a href="{{ l.href }}" onMouseEnter="{{ closeSvc }}" style="font-size:14px;letter-spacing:0.005em;font-weight:500;text-decoration:none;color:{{ l.color }}" style-hover="color:#FCFCED">{{ l.label }}</a>
      </sc-for>
    </nav>
    <div style="display:flex;align-items:center;gap:14px;flex-shrink:0">
      <a href="tel:+10000000000" style="display:none;align-items:center;padding:10px 20px;background:#B1CDC6;color:#0E2438;text-decoration:none;font-weight:700;font-size:15px;letter-spacing:0.02em;white-space:nowrap" style-hover="background:#D2E3DE;color:#0E2438" data-ws-desk="1">(000) 000-0000</a>
      <button onClick="{{ toggle }}" aria-label="Menu" style="display:flex;flex-direction:column;justify-content:center;gap:5px;width:44px;height:44px;padding:0 10px;background:transparent;border:1px solid rgba(252,252,237,0.18);cursor:pointer" data-ws-burger="1">
        <span style="display:block;height:2px;width:100%;background:#FCFCED"></span>
        <span style="display:block;height:2px;width:100%;background:#FCFCED"></span>
        <span style="display:block;height:2px;width:100%;background:#FCFCED"></span>
      </button>
    </div>
  </div>

  <sc-if value="{{ svcOpen }}" hint-placeholder-val="{{ false }}">
    <div style="position:absolute;left:0;right:0;top:100%;background:#0E2438;border-bottom:1px solid rgba(252,252,237,0.14);box-shadow:0 24px 50px rgba(0,0,0,0.4)">
      <div style="max-width:1440px;margin:0 auto;padding:clamp(22px,2.4vw,34px) clamp(16px,4vw,56px);display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:clamp(20px,2.4vw,40px)">
        <sc-for list="{{ groups }}" as="g" hint-placeholder-count="4">
          <div style="display:flex;flex-direction:column">
            <span style="font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:10px;letter-spacing:0.18em;text-transform:uppercase;color:#B1CDC6;padding-bottom:10px;margin-bottom:4px;border-bottom:1px solid rgba(177,205,198,0.4)">{{ g.title }}</span>
            <sc-for list="{{ g.items }}" as="s" hint-placeholder-count="4">
              <a href="{{ s.page }}" style="padding:8px 0;font-size:15px;font-weight:500;color:#FCFCED;line-height:1.3" style-hover="color:#B1CDC6">{{ s.title }}</a>
            </sc-for>
          </div>
        </sc-for>
      </div>
      <div style="max-width:1440px;margin:0 auto;padding:0 clamp(16px,4vw,56px) 22px">
        <a href="Services.dc.html" style="font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;letter-spacing:0.16em;text-transform:uppercase;color:#AEC1CD" style-hover="color:#B1CDC6">All services →</a>
      </div>
    </div>
  </sc-if>

  <sc-if value="{{ open }}" hint-placeholder-val="{{ false }}">
    <div style="border-top:1px solid rgba(252,252,237,0.1);padding:10px clamp(16px,4vw,56px) 22px;display:flex;flex-direction:column;max-height:calc(100vh - 74px);overflow-y:auto">
      <button type="button" onClick="{{ toggleMobSvc }}" style="display:flex;align-items:center;justify-content:space-between;padding:15px 0;border:none;border-bottom:1px solid rgba(252,252,237,0.09);background:transparent;font-family:Inter,sans-serif;font-size:17px;font-weight:600;color:#FCFCED;cursor:pointer;text-align:left">Services <span style="font-size:20px;color:#B1CDC6;line-height:1">{{ mobSvcIcon }}</span></button>
      <sc-if value="{{ mobSvc }}" hint-placeholder-val="{{ false }}">
        <div style="display:flex;flex-direction:column;padding:6px 0 10px 14px;border-bottom:1px solid rgba(252,252,237,0.09)">
          <sc-for list="{{ allServices }}" as="s" hint-placeholder-count="14">
            <a href="{{ s.page }}" onClick="{{ close }}" style="padding:11px 0;font-size:15.5px;font-weight:500;color:#D6E1E8" style-hover="color:#B1CDC6">{{ s.title }}</a>
          </sc-for>
        </div>
      </sc-if>
      <sc-for list="{{ links }}" as="l" hint-placeholder-count="5">
        <a href="{{ l.href }}" onClick="{{ close }}" style="padding:15px 0;border-bottom:1px solid rgba(252,252,237,0.09);font-size:17px;font-weight:600;text-decoration:none;color:#FCFCED" style-hover="color:#B1CDC6">{{ l.label }}</a>
      </sc-for>
      <a href="tel:+10000000000" style="margin-top:18px;text-align:center;padding:15px 20px;background:#B1CDC6;color:#0E2438;text-decoration:none;font-weight:700;font-size:17px;letter-spacing:0.02em" style-hover="background:#D2E3DE;color:#0E2438">Call (000) 000-0000</a>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:430,&quot;height&quot;:80},&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;home&quot;,&quot;services&quot;,&quot;safety&quot;,&quot;careers&quot;,&quot;questions&quot;,&quot;contact&quot;],&quot;default&quot;:&quot;home&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  state = { open: false, svc: false, mobSvc: false };
  componentDidMount() {
    const sync = () => {
      const wide = window.innerWidth >= 1000;
      document.querySelectorAll('[data-ws-desk]').forEach((n) => {
        n.style.display = wide ? (n.tagName === 'NAV' ? 'flex' : 'inline-flex') : 'none';
      });
      document.querySelectorAll('[data-ws-burger]').forEach((n) => { n.style.display = wide ? 'none' : 'flex'; });
      if (wide && this.state.open) this.setState({ open: false });
      if (!wide && this.state.svc) this.setState({ svc: false });
    };
    sync();
    this._sync = sync;
    window.addEventListener('resize', sync);
    this._key = (e) => { if (e.key === 'Escape' && this.state.svc) this.setState({ svc: false }); };
    document.addEventListener('keydown', this._key);
    if (!window.WASTELY_SERVICES) this._w = setInterval(() => { if (window.WASTELY_SERVICES) { clearInterval(this._w); this.forceUpdate(); } }, 40);
  }
  componentDidUpdate() { if (this._sync) this._sync(); }
  componentWillUnmount() {
    if (this._sync) window.removeEventListener('resize', this._sync);
    document.removeEventListener('keydown', this._key);
    clearInterval(this._w);
  }
  renderVals() {
    const active = this.props.active || 'home';
    const on = '#FCFCED', off = '#9FB4C1';
    const groups = window.WASTELY_SERVICES || [];
    const allServices = [];
    groups.forEach(g => g.items.forEach(s => allServices.push(s)));
    return {
      open: this.state.open,
      toggle: () => this.setState((s) => ({ open: !s.open })),
      close: () => this.setState({ open: false }),
      svcOpen: this.state.svc,
      openSvc: () => { if (!this.state.svc) this.setState({ svc: true }); },
      closeSvc: () => { if (this.state.svc) this.setState({ svc: false }); },
      toggleSvc: () => this.setState((s) => ({ svc: !s.svc })),
      mobSvc: this.state.mobSvc,
      mobSvcIcon: this.state.mobSvc ? '−' : '+',
      toggleMobSvc: () => this.setState((s) => ({ mobSvc: !s.mobSvc })),
      svcColor: active === 'services' ? on : off,
      groups, allServices,
      links: [
        { href: 'Wastely.dc.html#work', label: 'Work', color: off },
        { href: 'Safety.dc.html', label: 'Safety', color: active === 'safety' ? on : off },
        { href: 'Careers.dc.html', label: 'Careers', color: active === 'careers' ? on : off },
        { href: 'Questions.dc.html', label: 'Questions', color: active === 'questions' ? on : off },
        { href: 'Contact.dc.html', label: 'Contact', color: active === 'contact' ? on : off },
        { href: 'Wastely.dc.html#support', label: 'Support', color: active === 'support' ? on : off }
      ]
    };
  }
}
</script>
</body>
</html>
